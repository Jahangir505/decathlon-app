# Shopify CLI app configuration.
# client_id is filled in by `shopify app config link` against your Partner Dashboard app —
# do not hard-code real credentials here; this file is safe to commit.
client_id = "5aa6c179b0f7ae6eb02e814a2d290a17"
name = "Decathlon Partner Sync"
application_url = "https://backend-production-7b40.up.railway.app"
embedded = true
# Custom monorepo layout (not the default web/ folder) — points the CLI at our shopify.web.toml files.
web_directories = ["apps/web/backend", "apps/web/frontend"]

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_inventory,read_fulfillments"

[auth]
redirect_urls = [
  "https://backend-production-7b40.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  # Mandatory privacy (GDPR) webhooks — required for the Shopify App Store.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/api/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/api/webhooks/products-update"

  [[webhooks.subscriptions]]
  topics = ["inventory_levels/update"]
  uri = "/api/webhooks/inventory-levels-update"

  [[webhooks.subscriptions]]
  topics = ["fulfillments/create"]
  uri = "/api/webhooks/fulfillments-create"

  [[webhooks.subscriptions]]
  topics = ["fulfillments/update"]
  uri = "/api/webhooks/fulfillments-update"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/api/webhooks/refunds-create"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/api/webhooks/orders-cancelled"

[build]
automatically_update_urls_on_dev = false
